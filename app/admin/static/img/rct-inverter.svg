<svg xmlns="http://www.w3.org/2000/svg" viewBox="163 123 374 395">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="0.55" stop-color="#f3f6f7"/>
      <stop offset="1" stop-color="#e9eef0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ddde"/>
      <stop offset="1" stop-color="#c5cacc"/>
    </linearGradient>
    <linearGradient id="display" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4e595b"/>
      <stop offset="1" stop-color="#202728"/>
    </linearGradient>
  </defs>

  <!-- transparent canvas -->
  <g>
    <!-- main cabinet -->
    <path d="M175 125
             Q165 125 165 136
             L165 504
             Q165 516 177 516
             L523 516
             Q535 516 535 504
             L535 136
             Q535 125 524 125 Z"
          fill="url(#case)" stroke="#d4dade" stroke-width="2.4"/>

    <!-- subtle side rails -->
    <path d="M174 132 L174 508" stroke="#cfd5d8" stroke-width="3" opacity="0.7"/>
    <path d="M526 132 L526 508" stroke="#ffffff" stroke-width="3.5" opacity="0.88"/>

    <!-- center control panel -->
    <rect x="291" y="304" width="118" height="67" rx="8"
          fill="url(#panel)" stroke="#c4c9ca" stroke-width="1.5"/>
    <rect x="309" y="324" width="48" height="29" rx="3.5"
          fill="#141a1b" stroke="#7f888a" stroke-width="1.3"/>
    <rect x="313" y="328" width="40" height="21" rx="2"
          fill="url(#display)"/>
    <path d="M315 330 H351" stroke="#718083" stroke-width="1" opacity="0.45"/>

    <!-- simplified product mark -->
    <text x="368" y="334" font-family="Arial, Helvetica, sans-serif"
          font-size="13" font-weight="700" fill="#666d70">RCT</text>
    <path d="M394 326 l8 -4 -3.2 5.2 7.2 -1 -10 8 2.9 -5.4 -7.6 1.1z"
          fill="#d91f2b"/>
    <text x="370" y="346" font-family="Arial, Helvetica, sans-serif"
          font-size="4.8" font-weight="700" fill="#6d7476">POWER</text>
    <text x="370" y="354.5" font-family="Arial, Helvetica, sans-serif"
          font-size="4.2" fill="#5d6668">storage DC</text>

    <!-- corner screws -->
    <g fill="#1d2628">
      <circle cx="191" cy="141" r="3"/>
      <circle cx="509" cy="141" r="3"/>
      <circle cx="191" cy="500" r="3"/>
      <circle cx="509" cy="500" r="3"/>
    </g>
  </g>
</svg>
