<!--
  battery_middle.svg - one battery module, repeated once per module of the tower.
  Drawn flush from its top edge (y=0) to its bottom edge: the viewBox ends at 109, which is exactly
  where the 3-unit dark separator at y=107.5 ends (106..109). No transparent margin on either edge,
  so modules butt together seamlessly at gap:0.
  No drop shadow here - the assembled tower gets a single one in admin.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 109" width="220" height="109">
<defs>
  <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#eef2f4"/>
    <stop offset="10%" stop-color="#ffffff"/>
    <stop offset="88%" stop-color="#fbfcfd"/>
    <stop offset="100%" stop-color="#e7ecef"/>
  </linearGradient>
  <linearGradient id="edgeL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#cfd6db"/>
    <stop offset="100%" stop-color="#f5f7f8"/>
  </linearGradient>
</defs>
<g>
  <rect x="18" y="0" width="184" height="107" fill="url(#face)" stroke="#d8dde1" stroke-width="1"/>
  <path d="M18 0 H31 V107 H18 Z" fill="url(#edgeL)" opacity=".9"/>
  <line x1="18" y1="107.5" x2="202" y2="107.5" stroke="#34383b" stroke-width="3"/>
</g>
</svg>
