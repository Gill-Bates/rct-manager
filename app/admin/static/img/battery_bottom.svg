<!--
  battery_bottom.svg - base slice with the two feet, drawn from its top edge (y=0) downwards so the
  module above butts directly against it. The viewBox ends at 132, just past the feet (ink ends at
  131.4 including the 0.8 stroke), so there is no transparent margin below the tower either.
  No drop shadow here - the assembled tower gets a single one in admin.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 132" width="220" height="132">
<defs>
  <linearGradient id="edgeL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#cfd6db"/>
    <stop offset="100%" stop-color="#f5f7f8"/>
  </linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="75%" stop-color="#f2f4f5"/>
    <stop offset="100%" stop-color="#dfe4e7"/>
  </linearGradient>
</defs>
<g>
  <path d="M18 0 H202 V100 Q202 112 194 118 H26 Q18 112 18 100 Z" fill="url(#base)" stroke="#d8dde1" stroke-width="1"/>
  <path d="M18 0 H31 V104 Q31 112 36 118 H26 Q18 112 18 100 Z" fill="url(#edgeL)" opacity=".9"/>
  <line x1="18" y1="1.5" x2="202" y2="1.5" stroke="#34383b" stroke-width="3"/>
  <g fill="#25282a" stroke="#111" stroke-width=".8">
    <rect x="30" y="116" width="8" height="12" rx="1"/>
    <rect x="182" y="116" width="8" height="12" rx="1"/>
    <rect x="24" y="126" width="20" height="5" rx="1.5"/>
    <rect x="176" y="126" width="20" height="5" rx="1.5"/>
  </g>
</g>
</svg>
