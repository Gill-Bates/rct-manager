<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="33 22 194 764"
     role="img"
     aria-labelledby="rct-batt-title rct-batt-desc">
  <title id="rct-batt-title">White modular battery tower</title>
  <desc id="rct-batt-desc">Tall, narrow battery unit with five white modules, gray seams, and a beveled left edge. A soft shadow sits beneath the tower.</desc>

  <defs>
    <linearGradient id="rct-batt-front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef4f6"/>
      <stop offset="0.18" stop-color="#f8fbfc"/>
      <stop offset="0.72" stop-color="#fbfcfc"/>
      <stop offset="1" stop-color="#f1f5f6"/>
    </linearGradient>
    <linearGradient id="rct-batt-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd7da"/>
      <stop offset="1" stop-color="#e9eff1"/>
    </linearGradient>
    <linearGradient id="rct-batt-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdfd"/>
      <stop offset="1" stop-color="#f1f6f7"/>
    </linearGradient>
    <linearGradient id="foot-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe4e7"/>
      <stop offset="0.5" stop-color="#b8c0c5"/>
      <stop offset="1" stop-color="#8f989d"/>
    </linearGradient>
    <linearGradient id="foot-dark-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4ccd0"/>
      <stop offset="1" stop-color="#7f888d"/>
    </linearGradient>
  </defs>

  <!-- Case: beveled left side -->
  <path d="M35 44
           L47 24
           L60 24
           L60 784
           L47 768
           L35 741
           Z"
        fill="url(#rct-batt-side)"/>

  <!-- Front face -->
  <path d="M47 24
           H225
           V768
           H55
           L47 758
           Z"
        fill="url(#rct-batt-front)"
        stroke="#d7dfe2"
        stroke-width="1.6"
        stroke-linejoin="round"/>

  <!-- Top cover -->
  <path d="M47 24 H225 V82 H47 Z"
        fill="url(#rct-batt-top)"/>

  <!-- Module seams -->
  <g fill="none"
     stroke="#8f999c"
     stroke-width="2.2"
     stroke-linecap="square">
    <path d="M47 82 H225"/>
    <path d="M47 224 H225"/>
    <path d="M47 366 H225"/>
    <path d="M47 508 H225"/>
    <path d="M47 650 H225"/>
  </g>

  <!-- Left perspective seams -->
  <g fill="none"
     stroke="#9aa4a7"
     stroke-width="1.8"
     stroke-linecap="square"
     stroke-linejoin="miter">
    <path d="M35 105 L47 82"/>
    <path d="M35 238 L47 224"/>
    <path d="M35 376 L47 366"/>
    <path d="M35 518 L47 508"/>
    <path d="M35 660 L47 650"/>
  </g>

  <!-- Subtle edges -->
  <path d="M47 25 V758" fill="none" stroke="#dfe6e8" stroke-width="1"/>
  <path d="M224 25 V767" fill="none" stroke="#cfd7da" stroke-width="1"/>

  <!-- Base -->
  <path d="M55 768 H225" fill="none" stroke="#a9b1b4" stroke-width="2"/>

  <!-- Soft shadow beneath the tower -->
  <defs>
    <filter id="base-shadow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <ellipse cx="136" cy="777" rx="82" ry="5.5"
           fill="#6f7679" opacity="0.18" filter="url(#base-shadow)"/>
</svg>
