site_name: rct-manager Documentation
site_description: Vendor-neutral REST gateway for RCT Power inverters
site_author: Gill-Bates
site_url: https://gill-bates.github.io/rct-manager/

repo_name: Gill-Bates/rct-manager
repo_url: https://github.com/Gill-Bates/rct-manager
edit_uri: edit/main/docs/

# mkdocs.yml lives inside docs/, so the docs directory is its own folder.
docs_dir: .
site_dir: ../site
use_directory_urls: true

exclude_docs: |
  mkdocs.yml
  AGENTS.md

validation:
  nav:
    omitted_files: warn
    absolute_links: warn
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  logo: assets/rct-logo-white.svg
  favicon: assets/rct-logo-white.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      # Pages not yet committed (local builds, new files) fall back to the build date.
      fallback_to_build_date: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      # Material and Simple Icons shortcodes such as :material-api: and :simple-docker:.
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        # Hand a ```mermaid block to Material's bundled Mermaid renderer instead of the
        # highlighter, so flow diagrams render as graphics in both colour schemes.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Gill-Bates/rct-manager

extra_css:
  - stylesheets/extra.css

# Material fetches Mermaid from unpkg.com at view time unless a global `mermaid` already exists, so
# a blocked or offline CDN leaves diagrams as plain code. Self-hosting (pinned 11.4.1) avoids that.
extra_javascript:
  - javascripts/mermaid.min.js

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: getting-started/quick-start.md
    - Docker: getting-started/docker.md
    - Configuration: getting-started/configuration.md
  - Configuration:
    - Environment Variables: configuration/environment.md
    - Authentication: configuration/authentication.md
    - Network and TLS: configuration/network.md
    - Push Export: configuration/export.md
  - API Reference:
    - Overview: api/overview.md
    - Endpoints: api/endpoints.md
    - Errors: api/errors.md
    - Prometheus Metrics: api/prometheus.md
  - Operation: operation.md
  - Energy Manager: energy-manager.md
  - Development:
    - Setup: development/setup.md
    - Architecture: development/architecture.md
  - Reference:
    - Protocol Specification: reference/protocol.md
  - Troubleshooting: troubleshooting.md

