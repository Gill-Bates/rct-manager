services:
  rct-api:
    image: ${RCT_API_IMAGE:-giiibates/rct-manager}:${RCT_API_TAG:?RCT_API_TAG must be set}
    container_name: rct-api
    restart: always
    stop_grace_period: 1m
    ports:
      - "127.0.0.1:${RCT_API_PORT:-8000}:8000"
    env_file:
      - ../settings.env
    environment:
      TZ: ${TZ:-Etc/UTC}
      BIND_ADDRESS: 0.0.0.0
      BIND_PORT: "8000"
      ALLOW_NON_LOOPBACK_BIND: "true"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1m,mode=1777
    volumes:
      - rct-data:/app/data

volumes:
  rct-data:
