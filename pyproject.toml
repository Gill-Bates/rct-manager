[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rct-manager"
version = "1.2.3"
description = "Your RCT Power inverter is just one REST call away."
requires-python = ">=3.13"
authors = [{ name = "Gill-Bates" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "argon2-cffi>=25.1",
    "cryptography>=50.0.2",
    "fastapi>=0.139",
    "jinja2>=3.1.6",
    "markdown==3.11.1",
    "nh3==0.3.7",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "starlette>=1.7",
    "uvicorn>=0.51",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "hypothesis>=6.156",
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-git-revision-date-localized-plugin==1.6.0",
    "mkdocs-material==9.7.7",
    "mkdocs-minify-plugin==0.8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.catalog" = ["*.json"]
"app.admin" = ["templates/*.html", "static/*", "static/**/*", "*.json"]
"app.api" = ["docs_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# The code targets ~120 columns; without this Ruff assumes 88 and `ruff format --check` wants to
# reflow the whole tree (PY-02).
line-length = 120

[tool.ruff.lint]
# FAST: FastAPI-specific rules (not in Ruff's default set, checked for 0.16 and 0.17). S: flake8-bandit,
# only S102/S110/S112 are default; this is an authenticated REST gateway with password hashing and a
# TLS/token client.
extend-select = ["FAST", "S", "DTZ"]
# EXE001: modules carry a shebang in their file header but are run via `python -m app`.
# S101: the app's asserts only narrow Optional types or state an invariant that the code path above
# guarantees; the service is never started with `python -O` (no Dockerfile/entrypoint sets it).
extend-ignore = ["EXE001", "S101"]

[tool.ruff.lint.per-file-ignores]
# Tests use fixture credentials, loopback/any-address binds and local subprocesses.
"tests/**" = ["S104", "S105", "S106", "S310", "S603", "S607", "S608"]
# The SpotPriceInterval/SpotPriceSnapshot invariants are a ValueError-based domain contract (the
# optimizer-facing types raise one error type for every violation, type or value); the parser maps
# them to SpotMarketResponseError. TRY004 would force TypeError and break that single-error contract.
"app/spotmarket/models.py" = ["TRY004"]
# The optimizer domain follows the same single-error contract: invalid values and runtime-passed
# wrong types both surface as ValueError from its self-validating public dataclasses and the pure
# helpers/optimizer that consume them.
"app/optimizer/models.py" = ["TRY004"]
"app/optimizer/align.py" = ["TRY004"]
"app/optimizer/greedy.py" = ["TRY004"]
# Every interpolated value goes through literal()/ident() or int() (defined in this module), so
# S608 is a reviewed false positive here.
"app/export/questdb_admin.py" = ["S608"]
