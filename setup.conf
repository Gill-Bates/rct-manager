# =============================================================================
# rct-api - Setup & Deployment
# =============================================================================

# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/rct-manager/.venv
source /opt/rct-manager/.venv/bin/activate
pip install --upgrade pip
pip install -e '/opt/rct-manager[dev]'

# --- Verify ---
cd /opt/rct-manager && source .venv/bin/activate && \
ruff check . && python -m pytest -q
# Devices are configured in the admin GUI after first start.
python -m app validate

# --- Run locally ---
cd /opt/rct-manager && source .venv/bin/activate && \
export LOG_LEVEL="INFO" TZ="Europe/Berlin" && \
python -m app

# --- Manual Build ---
cd /opt/rct-manager && docker/build.sh

# --- Docs Check ---
# Check that documentation and inline comments match current behavior and are written in English.

# --- Squash Commit ---
Squash-merge all commits into main, create a new tag, tag it as v<version> (version from pyproject.toml), and push the tag. Use as commit Message "Release <version>" Then delete the feature branch locally and remotely.

# --- Prune ---
docker system prune -af
docker buildx prune -af

# --- Commit ---
# Write an English commit message based on the changes and commit the current worktree. Do not push.
