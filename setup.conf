# =============================================================================
# rct-api - Setup & Deployment
# =============================================================================

# --- Local Development Setup ---
command -v python3.13 >/dev/null 2>&1 && PYTHON=python3.13 || PYTHON=python3
$PYTHON -m venv /opt/rct-manager/.venv
source /opt/rct-manager/.venv/bin/activate
pip install --upgrade pip
pip install -e '/opt/rct-manager[dev]'

# --- Verify ---
cd /opt/rct-manager && source .venv/bin/activate && \
ruff check . && python -m pytest -q
# Devices are configured in the admin GUI after first start.
python -m app validate

# --- Run locally ---
cd /opt/rct-manager && source .venv/bin/activate && \
export LOG_LEVEL="INFO" TZ="Europe/Berlin" && \
python -m app

# --- Manual Build ---
cd /opt/rct-manager && docker/build.sh

# --- Docs Check ---
# Check that documentation and inline comments match current behavior and are written in English.

# --- Squash Commit ---
Squash-merge all commits into main, create a new tag, tag it as v<version> (version from pyproject.toml), and push the tag. Use as commit Message "Release <version>" Then delete the feature branch locally and remotely.

# --- Prune ---
docker system prune -af
docker buildx prune -af

# --- Commit ---
# Write an English commit message based on the changes and commit the current worktree. Do not push.

# --- UI Setup ---
# --- Lightpanda (preferred for fast, non-visual UX checks) ---
curl -fsSL https://pkg.lightpanda.io/install.sh | bash
export PATH="$HOME/.local/bin:$PATH"
lightpanda version
# Start the CDP server in a separate terminal for scripted DOM checks.
lightpanda serve --host 127.0.0.1 --port 9222

# --- Full browsers for layout, screenshots and Safari-near checks ---
# One-time, centrally managed toolset outside this repository; keep its package-lock.json.
UX_TOOLS_DIR=/opt/ux-test-tools
mkdir -p "$UX_TOOLS_DIR" || exit
cd "$UX_TOOLS_DIR" || exit
npm init -y
npm install --save-dev --save-exact playwright@1.62.0 @axe-core/playwright@4.12.1
./node_modules/.bin/playwright install --with-deps chromium webkit firefox

# --- Browser E2E against an isolated test database and simulated inverter ---
# The current driver still expects the first password in stdout; adapt it to "Password file:" first.
cd /opt/rct-manager || exit
UX_ARTIFACT_DIR=$(mktemp -d /tmp/rct-ux-e2e.XXXXXX)
PLAYWRIGHT_DIR="$UX_TOOLS_DIR" PYTHON=/opt/rct-manager/.venv/bin/python \
  node tests/e2e/admin_flow.mjs "$UX_ARTIFACT_DIR"