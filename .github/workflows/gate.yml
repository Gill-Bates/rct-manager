# .github/workflows/gate.yml
# Copyright (C) 2026 Gill-Bates http://github.com/Gill-Bates
#
# Reusable: ruff, pytest, workflow lint, Dockerfile check and manifest
# invariants. Called by ci.yml for every push/PR and by release.yml before a
# tag is allowed to publish, so a release can prove the exact commit it
# builds passed this gate - not merely that the commit is reachable from
# main, which says nothing about whether its own CI run passed or is still
# running.

name: Gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Ruff + pytest
    # Named image instead of ubuntu-latest, so two runs of one commit cannot
    # disagree about the OS during the runner-image migration.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches requires-python in pyproject.toml and the Dockerfile base.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The tests import app/, so the runtime dependencies come along with dev.
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff
        run: ruff check --output-format=github .

      # No settings.env on purpose: the tests build their own settings.
      - name: pytest
        run: python -m pytest -q

  actions:
    name: Workflow lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # actionlint-py wraps the actionlint binary; .github/actionlint.yaml is
      # picked up automatically.
      - name: actionlint
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install actionlint-py
          actionlint

  container:
    name: Dockerfile + build script
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image is built by hand, so a broken Dockerfile or script would stay
      # invisible until then. -n parses without executing.
      - name: Build script syntax
        run: bash -n docker/build.sh

      # BuildKit's linter resolves stages, ARG/ENV and COPY --from targets
      # without running a build step. Context is the repository root, as in
      # docker/build.sh.
      - name: Dockerfile check
        run: docker build --check -f docker/Dockerfile .

  manifest:
    name: pyproject.toml is the only manifest
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dockerfile reads its dependency list from pyproject.toml; a second
      # manifest would give image, CI and docs two versions to disagree about.
      - name: Reject reintroduced manifests
        run: |
          set -euo pipefail
          failed=0
          for stale in requirements.txt docs/requirements-docs.txt; do
            if [ -e "$stale" ]; then
              echo "ERROR: $stale exists - pyproject.toml is the single manifest"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]

      - name: Version is release-shaped
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "pyproject.toml version: ${VERSION}"
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
