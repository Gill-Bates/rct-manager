# .github/workflows/docs-build.yml
# Copyright (C) 2026 Gill-Bates http://github.com/Gill-Bates
#
# Builds the MkDocs site strictly, scans its dependencies and deploys it to
# GitHub Pages from main. The scan runs in the same job and on the same
# installed environment as the build, not a separately resolved one, so there
# is no window in which the two can diverge without a lock file. Related:
# ci.yml.

name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'LICENSE'
      - 'pyproject.toml'
      - '.github/workflows/docs-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'LICENSE'
      - 'pyproject.toml'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:
  schedule:
    # Weekly re-scan: new CVEs in the docs dependencies would otherwise only
    # surface when something in the repository happens to change.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for the revision-date plugin
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Only the docs extra is installed, not the project and its runtime stack.
      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["docs"]))' > requirements-docs.txt
          cat requirements-docs.txt
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt
      # Freezes the exact environment the build step below runs in. No lock
      # file: without one, resolving separately for the scan (a second pip
      # install into another venv) can land on a different version than this
      # run's build did - freezing what is already installed here instead of
      # re-resolving removes that gap entirely rather than narrowing it.
      - name: Freeze installed versions for scanning
        run: |
          set -euo pipefail
          pip freeze --all > docs-requirements-frozen.txt
          echo "Scanning $(grep -c '==' docs-requirements-frozen.txt) resolved packages"
      # Vulnerabilities only; secret and misconfig scanning of the sources is
      # not part of this pipeline. The file name must contain "requirement" or
      # Trivy's pip analyzer skips it.
      - name: Trivy scan docs dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'docs-requirements-frozen.txt'
          scanners: 'vuln'
          trivyignores: '.trivyignore'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          timeout: '5m'

      - name: Build documentation
        run: mkdocs build -f docs/mkdocs.yml --strict

      # img.shields.io is excluded: it throttles, and a 503 badge says nothing
      # about the documentation. The site's own URL is not deployed yet on the
      # first run. 404.html uses root-relative links (/rct-rest-api/...) derived
      # from site_url so it works at any depth; lychee cannot resolve those locally.
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose
            --no-progress
            --exclude 'fonts\.gstatic\.com'
            --exclude 'img\.shields\.io'
            --exclude 'gill-bates\.github\.io/rct-rest-api'
            --exclude-path 'site/404\.html'
            './site/**/*.html'
          fail: true

      - name: Upload artifact
        if: |
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

          trivyignores: '.trivyignore'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          timeout: '5m'

  deploy:
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
