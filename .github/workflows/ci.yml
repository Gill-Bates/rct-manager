# .github/workflows/ci.yml
# Copyright (C) 2026 Gill-Bates http://github.com/Gill-Bates
#
# The PR gate: calls gate.yml (ruff, pytest, workflow lint, Dockerfile check,
# manifest invariants) for every push and pull request. release.yml calls the
# same reusable workflow before a tag is allowed to publish, so both run
# identical checks against identical code - see gate.yml for why that matters.
# Related: docs-build.yml (documentation). docker/build.sh stays the manual
# local-build path.

name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/gate.yml
    permissions:
      contents: read
